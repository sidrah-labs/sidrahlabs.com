deployments:
  kicker_number: "01"
  kicker_label: "Fixed-scope deployments"
  title: "Targeted deployments"
  title_accent: "."
  intro: >
    Specific business outcomes, defined timelines, and high-margin engineering powered by our internal software harnesses. No open-ended hourly billing or staff-augmentation fluff.
  cards:
    - code: "A / AI-READINESS & MIGRATION"
      duration: "14–21 days"
      title: "Legacy ERP & unstructured data to AI-ready Lakehouse"
      description: >
        Transition hostile SQL/Oracle/ERP silos and complex PDF/document streams into a governed Databricks Medallion architecture—wired directly to a concrete last-mile activation (a governed Genie/BI space, MCP context endpoint, or automated financial workflow).
      focus: "Legacy ERP extraction · Unstructured-to-Delta · Last-mile AI activation"
    - code: "B / UNSAAS & COST OFF-RAMP"
      duration: "14 days"
      title: "Fivetran off-ramp & full-recompute refactoring"
      description: >
        Eliminate $25k+/yr Fivetran MAR billing spikes, rigid SaaS data lock-in, and silent full-table recomputes draining Serverless DBUs. We replace managed connectors with owned, incremental Python (dlt / PySpark) pipelines inside your VPC with mathematical source parity.
      focus: "UnSaaS ingestion · Row-hash parity · DBU & MAR cost reduction"
    - code: "C / PIPELINE HARDENING"
      duration: "10–14 days"
      title: "Pre-execution contract gates & Golden-SQL evals"
      description: >
        When engineers and AI coding/SQL agents ship pipeline mutations at machine speed, syntax checks pass while join fan-outs, rounding drift, and schema changes silently corrupt Gold tables. We install deterministic pre-execution gates and golden regression suites.
      focus: "Schema contracts · AST query checks · Golden-SQL evaluation"
  scope_note: "TIMELINES ARE FIXED SPRINT TARGETS; EXACT SCOPE AND PARITY GUARANTEES ARE LOCKED AFTER TECHNICAL DISCOVERY."

architecture:
  kicker_number: "02"
  kicker_label: "System topology"
  title: "The high-assurance pattern"
  title_accent: "."
  intro: >
    Every deployment installs a deterministic execution flow. Hostile structured and unstructured sources are normalized, mathematically reconciled for parity, and gated by explicit contracts before mutating production state or feeding AI agents.
  diagram_steps:
    - id: "01"
      title: "Hostile Sources"
      desc: "Legacy ERPs, CDC-locked SQL DBs, SaaS APIs, messy PDFs"
      tag: "EXTRACT"
    - id: "02"
      title: "Metadata & Rules Engine"
      desc: "Config-driven PySpark/dlt ingestion, deterministic DataFrame rules"
      tag: "NORMALIZE"
    - id: "03"
      title: "Pre-Execution Gates"
      desc: "Explicit schema contracts, AST query checks, row-hash parity"
      tag: "VERIFY"
    - id: "04"
      title: "AI-Ready Gold Layer"
      desc: "Governed Delta tables powering BI, Genie, and MCP agents"
      tag: "ACTIVATE"

method:
  kicker_number: "03"
  kicker_label: "Delivery engine"
  title: "Services, engineered as software"
  title_accent: "."
  intro: >
    We don't start from a blank repository or bill hours to reinvent plumbing. Every sprint deploys our proprietary internal software accelerators directly into your cloud VPC—compounding our delivery speed and your pipeline reliability.
  pillars:
    - number: "01"
      title: "Metadata-driven ingestion & UnSaaS kit"
      description: "Battle-tested PySpark and Python dlt frameworks for hostile ERP snapshot/merge diffing, high-concurrency API/web extraction, and zero-row-loss CDC reconciliation."
    - number: "02"
      title: "Deterministic DataFrame rules & parity engine"
      description: "Modular business-logic harnesses and automated row-hash/distribution parity checkers that prove migrated tables match legacy financial and operational ground truth."
    - number: "03"
      title: "Pre-execution schema & AST logic gates"
      description: "Static query analysis, explicit schema contracts, and golden-dataset evaluation harnesses that intercept destructive SQL mutations and silent metric drift before execution."
  footer_left: "PROPRIETARY INTERNAL ACCELERATORS"
  footer_right: "DEPLOYED INSIDE YOUR CLOUD VPC ↗"

proof:
  kicker_number: "04"
  kicker_label: "Field evidence"
  title: "Built to run. Built to last"
  title_accent: "."
  bar_title: "FIELD_NOTES / PRODUCTION_SYSTEMS_&_RESEARCH"
  status_badge: "VERIFIED TRACK RECORD"
  entries:
    - index: "01"
      title: "Zero-downtime ERP Lakehouse & metadata ingestion"
      description: "Architected and operated an end-to-end Databricks Medallion lakehouse across complex ERP financial and payroll schemas. Engineered a config-driven PySpark snapshot/merge framework (onboarding new tables via metadata inserts without code rewrites) and automated multi-environment promotion—running in production for 2+ years."
      tag: "2+ YEARS PRODUCTION"
    - index: "02"
      title: "High-concurrency unstructured & HealthAI extraction"
      description: "Engineered fault-tolerant extraction infrastructure for a Silicon Valley medical AI team and enterprise pipelines—combining 100+ asynchronous spiders (bounded semaphores, custom proxy/rate-limit governors) with layout-aware PDF/Table vision models to turn messy documents into schema-validated tables."
      tag: "100+ EXTRACTORS / VISION"
    - index: "03"
      title: "Symbolic execution & neuro-symbolic verification"
      description: "Founded by a Databricks Certified Data Engineer Professional with applied formal-methods research extending JavaPathFinder (JPF) and NeuroSPF symbolic execution harnesses—bridging classical constraint solving with neural/LLM representations."
      tag: "JPF / NEURO-SYMBOLIC R&D"
  foot_notes:
    - "DATABRICKS CERTIFIED PRO"
    - "DETERMINISTIC PARITY"
    - "ZERO SILENT CORRUPTION"

research:
  kicker_number: "05"
  kicker_label: "The Lab (Applied R&D)"
  title: "Verification at the speed"
  title_sub: "of AI generation"
  title_accent: "."
  lead: >
    AI coding agents and automated migration tools can generate 240%+ more commits and SQL transformations—but without machine-checked verification, AI-paced engineering carries a poison pill: catastrophic, silent bugs in production.
  body: >
    To capture the real economic velocity of AI, verification must run as fast as generation. Sidrah Labs is developing reusable formal verification infrastructure and neuro-symbolic logic firewalls—combining relational-algebra/AST compilers with SMT solvers (Z3) and incremental diff engines to mathematically prove that AI-generated code patches, SQL queries, and agent tool-calls preserve strict business invariants before they ever execute.
  boundary_note: >
    THE COMPOUNDING FLYWHEEL: Every enterprise migration and pipeline hardening sprint we execute exposes real-world failure modes that harden our internal verification harnesses—funding our independence today while forging the standalone verification infrastructure of tomorrow.
  github_link:
    label: "Follow our verification research on GitHub"
    href: "https://github.com/sidrah-labs"

