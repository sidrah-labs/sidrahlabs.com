hero:
  headline: "Data systems you can trust—and change safely."
  sub: >
    Sidrah Labs is a services-as-software company. We deliver fixed-scope Databricks lakehouses on our own engineering toolchain, and harden that toolchain with formal verification research.
  thesis: "Services fund the lab. Engagements test the software. Research hardens the foundation."

thesis_pillars:
  - id: "01"
    name: "Services"
    role: "Production Deployments"
    desc: "Fixed-scope migrations, connector off-ramps, and pipeline hardening on Databricks. 10–21 days."
  - id: "02"
    name: "Software"
    role: "Internal Toolchain"
    desc: "Reused ingestion harnesses, row-hash parity checkers, and schema gates. Deployed directly into your VPC."
  - id: "03"
    name: "Research"
    role: "Formal Verification"
    desc: "SMT-based logic firewalls, symbolic execution (JPF/NeuroSPF), and pre-execution query verification."

engagements:
  section_id: "01"
  title: "Fixed-Scope Engagements"
  note: "Timelines are sprint targets. Scope and parity guarantees are fixed after a technical discovery."
  entries:
    - code: "ENG-01"
      name: "Legacy ERP to AI-Ready Lakehouse"
      duration: "14–21 days"
      desc: "Migrate locked-in SQL, Oracle, and ERP silos into a governed Databricks Medallion architecture. Delivered as a reconciled Gold layer ready for BI, Genie, and AI agents."
      deliverables:
        - "Config-driven PySpark snapshot/merge diffing"
        - "Structured Bronze, Silver, and reconciled Gold layers"
        - "Direct table onboarding by configuration, not bespoke code"
    - code: "ENG-02"
      name: "Un-SaaS Pipeline Off-Ramp"
      duration: "14 days"
      desc: "Replace metered SaaS connectors (such as Fivetran) with high-performance PySpark pipelines running inside your own VPC, eliminating runaway row-sync billing."
      deliverables:
        - "Self-hosted, zero-row-loss ingestion pipelines"
        - "Mathematical row-hash parity against legacy source"
        - "Full data sovereignty with no third-party transit"
    - code: "ENG-03"
      name: "Pipeline Hardening & Logic Firewalls"
      duration: "10–14 days"
      desc: "Install explicit schema contracts and pre-execution gates that intercept destructive mutations and silent semantic drift before execution—whether written by humans or AI agents."
      deliverables:
        - "Pre-execution AST query validation & schema contracts"
        - "Databricks Asset Bundles (DABs) multi-environment CI/CD"
        - "Automated Golden-SQL regression testing"

toolchain:
  section_id: "02"
  title: "Internal Toolchain"
  desc: "We do not bill hours to reinvent plumbing from scratch. Each engagement adapts the same battle-tested software assets directly to your cloud estate."
  modules:
    - mono_tag: "PKG / INGEST"
      title: "Metadata Ingestion Framework"
      details: "High-concurrency PySpark frameworks for snapshot/merge diffing, high-watermark CDC reconciliation, and structured schema evolution."
    - mono_tag: "PKG / PARITY"
      title: "Rules & Parity Engine"
      details: "Modular DataFrame rules engine and automated row-hash reconciliation proving migrated tables mathematically match legacy ground truth."
    - mono_tag: "PKG / GATES"
      title: "Pre-Execution Schema Gates"
      details: "Static query analysis and invariant assertions that intercept breaking changes, type mismatches, and destructive DDL prior to runtime."

research:
  section_id: "03"
  title: "Applied Research"
  premise: "As code generation accelerates, the bottleneck shifts from writing changes to verifying their safety."
  body: >
    Sidrah Labs investigates AST/SMT-based query verification, relational algebra compilation, and symbolic execution harnesses (extending JavaPathFinder and NeuroSPF). Our goal is proving that proposed pipeline transformations cannot execute destructive mutations or corrupt production invariants.
  flywheel: "Production deployments expose edge-case failure modes. Those failures become formal test cases for our verification research, which in turn hardens the gates installed in future deployments."
  github_url: "https://github.com/sidrah-labs"

field_notes:
  section_id: "04"
  title: "Field Notes & Track Record"
  entries:
    - metric: "2+ YRS"
      title: "Self-Service ERP Lakehouse"
      client: "Enterprise Production"
      summary: "End-to-end Databricks Medallion lakehouse operating across complex ERP schemas. Reusable PySpark snapshot/merge framework operating continuously without architectural regressions."
    - metric: "100+ SPIDERS"
      title: "HealthAI Extraction Infrastructure"
      client: "Silicon Valley HealthAI Team"
      summary: "Fault-tolerant extraction pipelines combining 100+ asynchronous extractors with layout-aware vision models to feed schema-validated analytical tables."
    - metric: "RESEARCH"
      title: "Neuro-Symbolic & Symbolic Execution"
      client: "Formal Methods Laboratory"
      summary: "Applied formal-methods research extending JavaPathFinder (JPF) and NeuroSPF symbolic execution harnesses, bridging constraint solving with neural representations."
  credential: "Led by a Databricks Certified Data Engineer Professional."

closing:
  title: "Start with a technical discovery."
  desc: "Bring your legacy migration, your runaway connector invoice, or the pipeline you cannot safely change. You receive a verified technical specification and a fixed sprint timeline before any work begins."

