deployments:
  kicker_number: "01"
  kicker_label: "Fixed-scope deployments"
  title: "Targeted deployments"
  title_accent: "."
  intro: >
    Specific business outcomes, defined timelines, and high-margin engineering powered by our internal software harnesses. No open-ended hourly billing or staff-augmentation fluff.
  cards:
    - code: "A / AI-READINESS"
      duration: "14–21 days"
      title: "Legacy ERP to AI-Ready Lakehouse"
      description: >
        95% of AI pilots fail because they are plugged into undocumented, hostile legacy databases. We migrate locked-in SQL/Oracle/ERP silos into a governed Databricks Medallion architecture—delivering a clean, verified Gold layer ready for BI and AI agents.
      focus: "Legacy ERP extraction · Unstructured-to-Delta · AI-ready Gold layer"
    - code: "B / UNSAAS"
      duration: "14 days"
      title: "The 'Un-SaaS' Migration (Cost Off-Ramp)"
      description: >
        Stop paying rent on your data. We rip out expensive, metered SaaS connectors (like Fivetran) and replace them with owned, high-performance PySpark pipelines running directly inside your VPC. Slash your monthly data pipeline bills by up to 80% while retaining mathematical source parity.
      focus: "UnSaaS ingestion · Eliminate MAR billing · DBU cost reduction"
    - code: "C / HARDENING"
      duration: "10–14 days"
      title: "Pipeline Hardening & Logic Firewalls"
      description: >
        When junior engineers or AI coding agents ship pipeline edits at machine speed, syntax checks pass while silent semantic errors corrupt production. We install explicit schema contracts and deterministic pre-execution gates that physically block destructive SQL before it executes.
      focus: "Schema contracts · Logic firewalls · Golden-SQL evaluation"
  scope_note: "TIMELINES ARE SPRINT TARGETS; EXACT SCOPE AND PARITY GUARANTEES ARE LOCKED AFTER TECHNICAL DISCOVERY."

architecture:
  kicker_number: "02"
  kicker_label: "System topology"
  title: "The high-assurance pattern"
  title_accent: "."
  intro: >
    Every deployment installs an explicit, deterministic flow. Hostile sources are normalized, mathematically reconciled for parity, and gated by strict contracts before mutating production state or feeding AI agents.
  diagram_steps:
    - id: "01"
      title: "Hostile Sources"
      desc: "Legacy ERPs, SaaS APIs, CDC-locked DBs, messy PDFs"
      tag: "EXTRACT"
    - id: "02"
      title: "Metadata & Rules Engine"
      desc: "Config-driven PySpark/dlt ingestion, deterministic DataFrame rules"
      tag: "NORMALIZE"
    - id: "03"
      title: "Pre-Execution Gates"
      desc: "Explicit schema contracts, AST query checks, row-hash parity"
      tag: "VERIFY"
    - id: "04"
      title: "AI-Ready Gold Layer"
      desc: "Governed Delta tables powering BI, Genie, and MCP agents"
      tag: "ACTIVATE"

method:
  kicker_number: "03"
  kicker_label: "Delivery engine"
  title: "Services, engineered as software"
  title_accent: "."
  intro: >
    We don't start from a blank repository or bill hours to reinvent standard plumbing. Each sprint deploys our proprietary internal software accelerators directly into your cloud VPC—compounding our delivery speed and your pipeline reliability.
  pillars:
    - number: "01"
      title: "Metadata-driven ingestion & UnSaaS kit"
      description: "Battle-tested PySpark frameworks for hostile ERP snapshot/merge diffing, high-concurrency API extraction, and zero-row-loss CDC reconciliation."
    - number: "02"
      title: "Deterministic DataFrame rules & parity engine"
      description: "Modular business-logic harnesses and automated row-hash parity checkers that prove migrated tables mathematically match legacy financial ground truth."
    - number: "03"
      title: "Pre-execution schema & logic gates"
      description: "Static query analysis, explicit contracts, and evaluation tools that intercept destructive SQL mutations and metric drift before execution."
  footer_left: "PROPRIETARY INTERNAL ACCELERATORS"
  footer_right: "DEPLOYED INSIDE YOUR CLOUD VPC ↗"

proof:
  kicker_number: "04"
  kicker_label: "Field evidence"
  title: "Built to run. Built to last"
  title_accent: "."
  bar_title: "FIELD_NOTES / PRODUCTION_SYSTEMS_&_RESEARCH"
  status_badge: "VERIFIED TRACK RECORD"
  entries:
    - index: "01"
      title: "Zero-downtime ERP Lakehouse & metadata ingestion"
      description: "Architected and operated an end-to-end Databricks Medallion lakehouse across complex ERP schemas. Engineered a config-driven PySpark snapshot/merge framework (onboarding new tables via config inserts) and automated multi-environment promotion—running in production for 2+ years."
      tag: "2+ YEARS PRODUCTION"
    - index: "02"
      title: "High-concurrency unstructured & HealthAI extraction"
      description: "Engineered fault-tolerant extraction infrastructure for a Silicon Valley medical AI team—combining 100+ asynchronous spiders with layout-aware PDF/vision models to turn messy documents into schema-validated analytical tables."
      tag: "100+ EXTRACTORS / VISION"
    - index: "03"
      title: "Symbolic execution & neuro-symbolic verification"
      description: "Founded by a Databricks Certified Data Engineer Pro with applied formal-methods research extending JavaPathFinder (JPF) and NeuroSPF symbolic execution harnesses—bridging classical constraint solving with neural/LLM representations."
      tag: "JPF / NEURO-SYMBOLIC R&D"
  foot_notes:
    - "DATABRICKS CERTIFIED PRO"
    - "DETERMINISTIC PARITY"
    - "ZERO SILENT CORRUPTION"

research:
  kicker_number: "05"
  kicker_label: "The Lab (Applied R&D)"
  title: "Verification at the speed"
  title_sub: "of AI generation"
  title_accent: "."
  lead: >
    As automated tools generate software and pipeline logic 240% faster, the enterprise bottleneck shifts from code creation to code trust. Without machine-checked verification, AI-paced engineering carries a poison pill: catastrophic, silent bugs in production.
  body: >
    To capture the real economic velocity of AI, verification must run as fast as generation. Sidrah Labs is developing reusable formal verification infrastructure and neuro-symbolic logic firewalls. By combining relational-algebra compilers with SMT solvers (Z3) and incremental diff engines, we aim to mathematically prove that AI-generated code patches and SQL queries preserve strict business invariants before they ever execute.
  boundary_note: >
    THE COMPOUNDING FLYWHEEL: Every enterprise migration we execute exposes real-world failure modes that harden our internal verification harnesses—funding our independence today while forging the standalone verification infrastructure of tomorrow.
  github_link:
    label: "Explore our verification research on GitHub"
    href: "https://github.com/sidrah-labs"

