thesis:
  kicker_label: "Why us"
  title: "The hard part isn't moving data. It's changing systems without breaking trust."
  lead: >
    Legacy systems encode years of business rules, but those rules are rarely documented well enough to safely migrate or modify. Meanwhile, brittle pipelines and metered tools make change costly. We bring the engineering and verification infrastructure to modernize these systems without losing confidence in the results.
  points:
    - number: "01"
      title: "Undocumented rules make modernization risky"
      description: "Legacy databases and ERPs hold critical business logic in schemas, queries, and operational habits. Without a reliable way to surface and check those rules, teams cannot tell whether a migration preserves the meaning of the data."
    - number: "02"
      title: "Pipeline economics punish growth"
      description: "Per-row connectors can make routine data movement more expensive as volumes grow. For the right workloads, operating pipelines in your own cloud can reduce recurring costs and give you more control."
    - number: "03"
      title: "Faster code needs stronger guarantees"
      description: "Basic tests catch syntax and known examples, not every semantic regression. As engineers and AI coding tools produce changes faster, teams need automated checks that establish whether critical behavior has been preserved."

deployments:
  kicker_label: "Engagements"
  title: "Modernize legacy platforms. Verify every change."
  intro: >
    We begin with technical discovery to map your data sources, business rules, costs, and failure modes. Then we deploy purpose-built software in your cloud to modernize the platform and verify the outcome—with a clear scope, timeline, and price agreed upfront.
  cards:
    - code: "01 · AI-Ready Data"
      duration: "14–21 days"
      title: "Modernize a legacy data platform"
      outcome: "A governed lakehouse with data reconciled to the system of record."
      description: >
        We move data from SQL, Oracle, and ERP systems into a governed Databricks lakehouse. Reconciliation checks compare migrated tables with legacy records, giving your team evidence to review and sign off before relying on the new platform.
      focus: "Databricks Medallion lakehouse · Reconciled financial & operational data · Foundation for BI & AI"
    - code: "02 · Cost Reduction"
      duration: "14 days"
      title: "Replace metered SaaS pipelines"
      outcome: "Reduce recurring pipeline costs and run the code in your own cloud."
      description: >
        We assess metered SaaS connectors and, where the economics fit, replace them with pipelines that run in your cloud account. Parity checks compare old and new outputs during cutover to help protect continuity.
      focus: "Reduce per-row SaaS costs · Runs in your VPC · Output parity checks during cutover"
    - code: "03 · Reliability"
      duration: "10–14 days"
      title: "Verify pipeline changes before execution"
      outcome: "Catch changes that violate defined data contracts and business rules."
      description: >
        Syntax checks cannot detect every logic error. We install automated pre-execution checks for defined contracts and business rules, so teams can identify risky changes before they affect production data.
      focus: "Explicit data contracts · Automated pre-execution checks · Earlier detection of metric drift"
  scope_note: "Timelines are sprint targets. Exact scope, deliverables, and parity guarantees are locked after discovery."

proof:
  kicker_label: "Evidence"
  title: "Production systems. Verification research."
  intro: >
    Our work combines experience operating production data systems with research in formal verification. The results inform practical tools for making data changes more observable and dependable.
  entries:
    - index: "01"
      tag: "2+ years in production"
      title: "Enterprise ERP lakehouse with zero downtime"
      description: "Built and operated an end-to-end Databricks lakehouse across complex ERP schemas. A configuration-driven ingestion engine reduced new-table onboarding from weeks of custom code to a configuration change and has run in production for over two years."
    - index: "02"
      tag: "100+ production extractors"
      title: "Unstructured document pipelines for healthcare AI"
      description: "Built fault-tolerant extraction infrastructure for a medical AI company, combining more than 100 concurrent crawlers with vision models to turn clinical documents into validated analytical tables."
    - index: "03"
      tag: "In-house R&D"
      title: "Applied formal verification research"
      description: "Our research extends the JavaPathFinder (JPF) and NeuroSPF symbolic execution engines. This work in formal methods and symbolic execution informs our longer-term effort to verify software, including software produced by AI systems."

method:
  kicker_label: "How we work"
  title: "An infrastructure lab, not a staffing firm."
  intro: >
    We pair hands-on platform engineering with reusable internal software and applied research. Each engagement solves a concrete infrastructure problem today, while production experience informs the verification tools we are building for safer change tomorrow.
  pillars:
    - number: "01"
      title: "Understand the system before changing it"
      description: "We map your schemas, pipeline costs, dependencies, and business rules, then agree on a clear architecture and fixed scope before implementation."
    - number: "02"
      title: "Run in your environment"
      description: "We deploy our ingestion, diffing, and parity tools in your cloud VPC. You retain the delivered code and avoid a dependency on a recurring software license."
    - number: "03"
      title: "Make change verifiable"
      description: "We use reconciliation, explicit data contracts, and automated checks to test whether migrations and pipeline edits preserve defined behavior. Our research is advancing these methods toward stronger formal guarantees."

architecture:
  kicker_label: "Execution Flow"
  title: "Four steps, inside your cloud."
  intro: >
    Every engagement follows the same repeatable pattern inside your VPC.
  diagram_steps:
    - id: "01"
      title: "Extract"
      desc: "Pull from ERPs, databases, APIs, and documents without slowing down source systems."
      tag: "Sources"
    - id: "02"
      title: "Standardize"
      desc: "Clean and structure data using repeatable rules instead of brittle one-off scripts."
      tag: "Engine"
    - id: "03"
      title: "Verify"
      desc: "Prove row-for-row parity and check business rules before any production table updates."
      tag: "Gate"
    - id: "04"
      title: "Deliver"
      desc: "Serve trusted tables to executive dashboards, analysts, and AI applications."
      tag: "Outcome"

research:
  kicker_label: "Research"
  title: "Building verification for software that changes at AI speed."
  lead: >
    AI can generate code faster than teams can manually inspect every change. The challenge is not just producing software, but establishing that it preserves the properties people rely on.
  body: >
    We are developing verification tools that analyze data logic before execution. Using SMT solvers such as Z3 and relational-algebra analysis, we investigate whether proposed query and pipeline changes can violate specified rules. Our long-term goal is to extend this infrastructure to software generated automatically.
  boundary_note: >
    How this connects to client work: Modernization engagements expose real failure modes and business rules. Those lessons shape our tools, while advances in verification help make future deployments safer and more repeatable.
  github_link:
    label: "See our research on GitHub"
    href: "https://github.com/sidrah-labs"

