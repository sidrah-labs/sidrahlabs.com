hero:
  eyebrow: "Applied Data & Verification Lab"
  headline_prefix: "Data systems your business can "
  headline_accent: "trust"
  headline_suffix: "—delivered as software."
  body: >
    Sidrah Labs is an applied engineering and verification lab. We start with technical discovery to find why your data is slow, expensive, or unreliable. Then we deploy our own software inside your cloud to fix it—cutting pipeline costs by up to 80%, preparing legacy data for AI, and proving every number matches its source.
  cta:
    label: "Start with technical discovery"
    href: "mailto:azeem@sidrahlabs.com?subject=Technical%20Discovery%20%E2%80%94%20Sidrah%20Labs"
    email: "azeem@sidrahlabs.com"
  meta_index: "Research-led discovery · Services-as-software · Deployed in your cloud"

thesis:
  kicker_label: "Why us"
  title: "Why data projects stall—and why hiring more people doesn't fix them."
  lead: >
    Most teams face the same three problems: AI projects that can't launch because the underlying data is a mess, SaaS pipeline bills that grow every month, and agencies that charge by the hour to build everything from scratch.
  points:
    - number: "01"
      title: "AI fails when nobody trusts the numbers"
      description: "Most AI pilots never leave staging because they sit on top of undocumented ERPs and legacy databases. If finance and operations can't reconcile an AI output against the system of record, the project gets shelved."
    - number: "02"
      title: "Metered SaaS tools tax your growth"
      description: "Connector tools like Fivetran charge by the row. As your business grows, your bill climbs for simple data movement that could run inside your own cloud at a fraction of the cost."
    - number: "03"
      title: "Hourly consulting rewards slow delivery"
      description: "Traditional agencies start from a blank repository and bill you to reinvent standard plumbing. Worse, as teams and AI coding tools push changes faster, silent errors slip past basic tests and corrupt executive reports."

deployments:
  kicker_label: "Engagements"
  title: "Start with discovery. Deliver in weeks."
  intro: >
    Every engagement begins with technical discovery: we audit your sources, costs, and failure modes, and agree on a fixed scope and price. Then we deploy our own tested software inside your cloud to deliver the result in weeks, not quarters.
  cards:
    - code: "01 · AI-Ready Data"
      duration: "14–21 days"
      title: "Legacy ERP to AI-ready lakehouse"
      outcome: "Clean, reconciled data that leadership, analysts, and AI agents can use immediately."
      description: >
        We pull data out of locked-in SQL, Oracle, and ERP systems into a governed Databricks lakehouse. Every table is checked row-for-row against your legacy records so finance signs off on day one.
      focus: "Databricks Medallion lakehouse · Reconciled financial & operational tables · Ready for BI & AI"
    - code: "02 · Cost Reduction"
      duration: "14 days"
      title: "Replace metered SaaS pipelines"
      outcome: "Cut recurring pipeline bills by up to 80% and own the code outright."
      description: >
        Stop paying monthly rent per row. We replace metered SaaS connectors with fast, reliable pipelines that run inside your own cloud account—with zero downtime and verified parity during the switch.
      focus: "End per-row SaaS billing · Runs in your VPC · Verified zero-loss cutover"
    - code: "03 · Reliability"
      duration: "10–14 days"
      title: "Automated checks before code hits production"
      outcome: "Ship pipeline changes fast without breaking dashboards or corrupting metrics."
      description: >
        When engineers or AI tools edit SQL and pipelines, syntax checks pass while broken logic slips through. We install automated pre-execution gates that block bad changes before they touch production data.
      focus: "Explicit data contracts · Pre-execution logic checks · No silent metric drift"
  scope_note: "Timelines are sprint targets. Exact scope, deliverables, and parity guarantees are locked after discovery."

proof:
  kicker_label: "Evidence"
  title: "Proven in production. Backed by research."
  intro: >
    The software we deploy in client sprints comes from years of running production data systems and our own research in formal verification.
  entries:
    - index: "01"
      tag: "2+ years in production"
      title: "Enterprise ERP lakehouse with zero downtime"
      description: "Built and ran an end-to-end Databricks lakehouse across complex ERP schemas. Our configuration-driven ingestion engine cut new-table onboarding from weeks of custom code to a single config change—and has run in production for over two years."
    - index: "02"
      tag: "100+ production extractors"
      title: "Unstructured document pipelines for healthcare AI"
      description: "Built fault-tolerant extraction infrastructure for a Silicon Valley medical AI company—combining over 100 concurrent crawlers with vision models to turn messy clinical documents into validated analytical tables."
    - index: "03"
      tag: "In-house R&D"
      title: "Applied formal verification research"
      description: "Led by a Databricks Certified Data Engineer Professional with published research extending the JavaPathFinder (JPF) and NeuroSPF symbolic execution engines—applying mathematical verification to modern software and AI."

method:
  kicker_label: "How we work"
  title: "Services-as-software, powered by an applied lab."
  intro: >
    We are built like a product and research lab, not a staffing firm. Because we bring our own software to every engagement—and improve it through in-house R&D—you get the speed of a product with the precision of custom engineering.
  pillars:
    - number: "01"
      title: "Research-led discovery first"
      description: "We don't guess or sell open-ended retainers. We start by auditing your schemas, pipeline spend, and business rules—and hand you a clear architecture and fixed-scope plan."
    - number: "02"
      title: "Delivered with our own software"
      description: "We deploy our internal ingestion, diffing, and parity engines directly into your cloud VPC. You keep the code, with no lock-in or recurring license fees."
    - number: "03"
      title: "Moated by in-house verification"
      description: "Our verification tools check that every migration and pipeline edit preserves your business rules—giving you a level of mathematical assurance that manual testing cannot match."

architecture:
  kicker_label: "Execution Flow"
  title: "Four steps, inside your cloud."
  intro: >
    Every engagement follows the same repeatable pattern inside your VPC.
  diagram_steps:
    - id: "01"
      title: "Extract"
      desc: "Pull from ERPs, databases, APIs, and documents without slowing down source systems."
      tag: "Sources"
    - id: "02"
      title: "Standardize"
      desc: "Clean and structure data using repeatable rules instead of brittle one-off scripts."
      tag: "Engine"
    - id: "03"
      title: "Verify"
      desc: "Prove row-for-row parity and check business rules before any production table updates."
      tag: "Gate"
    - id: "04"
      title: "Deliver"
      desc: "Serve trusted tables to executive dashboards, analysts, and AI applications."
      tag: "Outcome"

research:
  kicker_label: "Research"
  title: "Our moat: verifying changes at the speed of AI."
  lead: >
    AI has made writing code fast, but trusting code hard. When engineers and AI assistants generate SQL and pipeline changes in seconds, manual review can't keep up—and one bad query can quietly corrupt months of reporting.
  body: >
    Our lab builds verification tools that check data logic automatically. Using mathematical solvers (SMT/Z3) and relational-algebra analysis, we test whether a proposed query or pipeline change can break your business rules before it ever runs.
  boundary_note: >
    Why this matters to clients: Every client project shows us real-world failure modes that make our verification tools sharper—and every advance in our lab makes your next deployment faster and safer.
  github_link:
    label: "See our research on GitHub"
    href: "https://github.com/sidrah-labs"

contact:
  title: "Start with technical discovery."
  body: >
    Tell us which legacy system is slowing you down, or what you're spending on data pipelines today. We'll review your setup directly and come back with a clear, fixed-scope plan.

